<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmallRAG</title>
  <style>
    :root { color-scheme: light; --ink: #17212b; --muted: #68737d; --line: #dce3e8; --brand: #176b5b; --soft: #eef7f4; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: #f5f7f8; font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { width: min(1080px, calc(100% - 32px)); margin: 48px auto; }
    header { margin-bottom: 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.04em; }
    header p { margin: 0; color: var(--muted); }
    .panel { padding: 24px; border: 1px solid var(--line); border-radius: 16px; background: white; box-shadow: 0 8px 30px rgba(23,33,43,.06); }
    form { display: grid; gap: 14px; }
    textarea { width: 100%; min-height: 118px; resize: vertical; padding: 14px; border: 1px solid #bdc8d0; border-radius: 10px; font: inherit; line-height: 1.6; }
    textarea:focus { outline: 3px solid #cce8e1; border-color: var(--brand); }
    .controls { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
    label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
    input { width: 92px; padding: 9px; border: 1px solid #bdc8d0; border-radius: 8px; }
    button { margin-left: auto; padding: 11px 24px; border: 0; border-radius: 9px; color: white; background: var(--brand); font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    #status { min-height: 24px; margin: 14px 2px 0; color: var(--muted); }
    #status.error { color: #b42318; }
    #result { display: none; margin-top: 22px; gap: 20px; }
    #result.visible { display: grid; }
    h2 { margin: 0 0 14px; font-size: 20px; }
    #answer { white-space: pre-wrap; line-height: 1.75; }
    .meta { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; color: var(--muted); font-size: 13px; }
    .chunk { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
    .chunk summary { padding: 14px 16px; background: var(--soft); cursor: pointer; font-weight: 650; }
    .chunk pre { margin: 0; padding: 16px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.65 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .chunk footer { padding: 0 16px 14px; color: var(--muted); font-size: 12px; }
    .empty { color: var(--muted); }
    @media (max-width: 600px) { main { margin: 24px auto; } .panel { padding: 18px; } button { width: 100%; margin-left: 0; } }
  </style>
</head>
<body>
  <main>
    <header><h1>SmallRAG</h1><p>基于 Confluence 知识库的轻量问答与检索查看器</p></header>
    <section class="panel">
      <form id="query-form">
        <label for="query">问题</label>
        <textarea id="query" required maxlength="4000" placeholder="请输入你想查询的问题……"></textarea>
        <div class="controls">
          <label>召回数量<input id="top-k" type="number" min="1" max="20" value="5"></label>
          <label>语义权重<input id="alpha" type="number" min="0" max="1" step="0.1" value="0.5"></label>
          <button id="submit" type="submit">开始查询</button>
        </div>
      </form>
      <div id="status" role="status" aria-live="polite"></div>
    </section>

    <section id="result">
      <article class="panel">
        <h2>回答</h2>
        <div id="answer"></div>
        <div id="meta" class="meta"></div>
      </article>
      <article class="panel">
        <h2>检索文本</h2>
        <div id="contexts"></div>
      </article>
    </section>
  </main>
  <script>
    const form = document.querySelector('#query-form');
    const submit = document.querySelector('#submit');
    const status = document.querySelector('#status');
    const result = document.querySelector('#result');
    const answer = document.querySelector('#answer');
    const meta = document.querySelector('#meta');
    const contexts = document.querySelector('#contexts');

    function safeSource(value) {
      try { const url = new URL(value); return ['http:', 'https:'].includes(url.protocol) ? url.href : ''; }
      catch { return ''; }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      status.className = '';
      status.textContent = '正在检索并生成回答……';
      result.classList.remove('visible');
      try {
        const response = await fetch('/v1/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: document.querySelector('#query').value.trim(),
            top_k: Number(document.querySelector('#top-k').value),
            alpha: Number(document.querySelector('#alpha').value),
            include_retrieval: true
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || `请求失败（HTTP ${response.status}）`);

        answer.textContent = data.answer;
        meta.replaceChildren();
        [`模型：${data.model}`, `总耗时：${data.latency_ms.total} ms`, `Request ID：${data.request_id}`]
          .forEach(text => { const span = document.createElement('span'); span.textContent = text; meta.append(span); });

        contexts.replaceChildren();
        if (!data.contexts?.length) {
          const empty = document.createElement('p'); empty.className = 'empty'; empty.textContent = '没有检索到可展示的文本。'; contexts.append(empty);
        } else {
          data.contexts.forEach(chunk => {
            const details = document.createElement('details'); details.className = 'chunk';
            const summary = document.createElement('summary');
            summary.textContent = `${chunk.rank}. ${chunk.document_name} · 得分 ${chunk.retrieval_score.toFixed(4)}`;
            const pre = document.createElement('pre'); pre.textContent = chunk.content;
            const footer = document.createElement('footer');
            const source = safeSource(chunk.source);
            if (source) { const link = document.createElement('a'); link.href = source; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = '打开来源'; footer.append(link); }
            if (chunk.truncated) footer.append(document.createTextNode(`${source ? ' · ' : ''}文本已截断`));
            details.append(summary, pre, footer); contexts.append(details);
          });
        }
        status.textContent = `完成，共展示 ${data.contexts?.length || 0} 条检索文本。`;
        result.classList.add('visible');
      } catch (error) {
        status.className = 'error';
        status.textContent = error instanceof Error ? error.message : '请求失败';
      } finally { submit.disabled = false; }
    });
  </script>
</body>
</html>
